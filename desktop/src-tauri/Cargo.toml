[package]
name = "conceptloom-desktop"
version = "0.1.1"
description = "Private, local-first ConceptLoom learning environment"
authors = ["ConceptLoom contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "conceptloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
